# Default configuration for Victron Orion-TR Smart D-Bus Service
#
# Copy this file to config.ini and edit with your device details.
# Get encryption keys from VictronConnect app:
#   Settings → Product Info → Instant Readout → SHOW
#
# The config.ini file is in .gitignore and will not be committed.

[DEFAULT]
# Device timeout in seconds (if no BLE advertisements received)
DEVICE_TIMEOUT = 60

# Logging level (DEBUG, INFO, WARNING, ERROR)
LOG_LEVEL = INFO


# Device Configuration
# --------------------
# Add one [DEVICE_*] section per Orion-TR device.
# Each device needs:
#   - MAC: Bluetooth MAC address (from VictronConnect or BLE scan)
#   - KEY: 32-character hex encryption key (from VictronConnect app)
#   - INSTANCE: Unique D-Bus device instance number (1, 2, 3, etc.)
#
# Example:

[DEVICE_1]
# MAC address (lowercase, with colons)
MAC = aa:bb:cc:dd:ee:ff

# Encryption key (32 hex characters, from VictronConnect app)
KEY = 00112233445566778899aabbccddeeff

# D-Bus device instance (must be unique)
# Start at 130 to avoid conflicts with other services
INSTANCE = 130

# [DEVICE_2]
# MAC = 11:22:33:44:55:66
# KEY = ffeeddccbbaa99887766554433221100
# INSTANCE = 131

# [DEVICE_3]
# MAC = aa:11:bb:22:cc:33
# KEY = 0123456789abcdef0123456789abcdef
# INSTANCE = 132

